name: Pre-merge Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/pre-merge-checks.yaml'
  workflow_dispatch:

concurrency:
  group: pre-merge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect frontend / backend changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  backend:
    name: Backend (lint / security / build)
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint / typecheck
        run: npx tsc --noEmit

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

  frontend:
    name: Frontend (lint / security / build)
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint / typecheck
        run: npx tsc --noEmit

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

  pre-merge-summary:
    name: Pre-merge gate
    needs: [detect-changes, backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        run: |
          echo "Frontend changed: ${{ needs.detect-changes.outputs.frontend }}"
          echo "Backend changed:  ${{ needs.detect-changes.outputs.backend }}"
          echo "Backend result:   ${{ needs.backend.result }}"
          echo "Frontend result:  ${{ needs.frontend.result }}"

          if [[ "${{ needs.detect-changes.outputs.backend }}" == "true" && "${{ needs.backend.result }}" != "success" ]]; then
            echo "Backend checks failed"
            exit 1
          fi

          if [[ "${{ needs.detect-changes.outputs.frontend }}" == "true" && "${{ needs.frontend.result }}" != "success" ]]; then
            echo "Frontend checks failed"
            exit 1
          fi

          if [[ "${{ needs.detect-changes.outputs.backend }}" != "true" && "${{ needs.detect-changes.outputs.frontend }}" != "true" ]]; then
            echo "No frontend/backend changes — skipping checks"
          fi

          echo "Pre-merge checks passed"

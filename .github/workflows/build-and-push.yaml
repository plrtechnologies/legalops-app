name: Build and Push

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/build-and-push.yaml'
  workflow_dispatch:

env:
  VERSION_MAJOR: '0'
  VERSION_MINOR: '0'
  DOCKERHUB_USERNAME: plrtechnologies

permissions:
  contents: write

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect frontend / backend changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.frontend }}
      backend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter paths
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  build-scan-push:
    name: ${{ matrix.component }} (build / trivy / push)
    needs: detect-changes
    if: |
      (matrix.component == 'frontend' && needs.detect-changes.outputs.frontend == 'true') ||
      (matrix.component == 'backend' && needs.detect-changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            context: frontend
            image: legalops-app-web
            tag_prefix: frontend
          - component: backend
            context: backend
            image: legalops-app-api
            tag_prefix: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next semantic version
        id: version
        run: |
          set -euo pipefail
          major="${VERSION_MAJOR}"
          minor="${VERSION_MINOR}"
          prefix="${{ matrix.tag_prefix }}-${major}.${minor}."

          git fetch --tags origin --force

          last_patch="$(
            git tag -l "${prefix}*" \
              | sed "s|^${prefix}||" \
              | grep -E '^[0-9]+$' \
              | sort -n \
              | tail -1
          )"
          next_patch="$(( ${last_patch:-0} + 1 ))"
          version="${major}.${minor}.${next_patch}"
          image="${DOCKERHUB_USERNAME}/${{ matrix.image }}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "git_tag=${{ matrix.tag_prefix }}-${version}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${{ matrix.component }} version ${version} (last patch=${last_patch:-none})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          load: true
          push: false
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Trivy scan (gate CRITICAL)
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          vuln-type: os,library
          ignore-unfixed: false

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Push latest and semantic tags
        run: |
          set -euo pipefail
          docker push "${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}"
          docker push "${{ steps.version.outputs.image }}:latest"

      - name: Publish git version tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.git_tag }}"
          git push origin "refs/tags/${{ steps.version.outputs.git_tag }}"
